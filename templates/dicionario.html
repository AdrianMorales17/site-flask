<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dicionário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container px-1">

            <a class="navbar-brand" href="{{ url_for('home') }}">
                FILMES FAVORITOS 🎬
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                
                <ul class="navbar-nav ms-auto">
                    
                    <li class="nav-item">
                        <a class="nav-link px-3" href="{{ url_for('home') }}">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link px-3" href="{{ url_for('lista') }}">Lista</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link px-3" href="{{ url_for('diciona') }}">Dicionário</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link px-3" href="{{ url_for('editar') }}">Editar</a>
                    </li>

                </ul>            

            </div>
        </div>
    </nav>
</header>

<div class="container mt-5">
    
    <div class="card p-4 shadow">
        <h3 class="text-center mb-4">Dicionário de Filmes</h3>

        {% if dados %}
        <table class="table-custom">
            
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Filme Favorito</th>
                    <th class="text-end">Ações</th>
                </tr>
            </thead>

            <tbody>
                {% for nome, filme in dados.items() %}
                <tr>

                    <td>{{ nome }}</td>
                    <td>{{ filme }}</td>

                    <td class="text-end">
                        <form action="{{ url_for('exclui') }}" method="post">
                            <input type="hidden" name="nome" value="{{ nome }}">
                            <input type="hidden" name="origem" value="dicionario">

                            <button class="btn btn-danger btn-sm">
                                Excluir
                            </button>
                        </form>
                    </td>

                </tr>
                {% endfor %}
            </tbody>

        </table>

        {% else %}
            <p class="text-center">Nenhum dado cadastrado.</p>
            <hr>
        {% endif %}

    <br>
        <center><a href="/"><button class="btn-primary">Voltar</button></a></center>
    </div>

</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>


</body>
</html>
