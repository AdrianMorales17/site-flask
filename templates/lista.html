<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Lista</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container px-1">

            <a class="navbar-brand" href="{{ url_for('home') }}">
                FILMES FAVORITOS 🎬
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                
                <ul class="navbar-nav ms-auto">
                    
                    <li class="nav-item">
                        <a class="nav-link px-3" href="{{ url_for('home') }}">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link px-3" href="{{ url_for('lista') }}">Lista</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link px-3" href="{{ url_for('diciona') }}">Dicionário</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link px-3" href="{{ url_for('editar') }}">Editar</a>
                    </li>

                </ul>            

            </div>
        </div>
    </nav>
</header>

    <div class="container mt-5 d-flex justify-content-center">
        <div class="card p-4 shadow" style="width: 400px; ">
            
            <center><h3>Lista de Usuários</h3></center>
            <br>

            {% if lista %}
                <ul class="list-group">
                    {% for nome in lista %}
                        <li class="list-group-item d-flex justify-content-between align-items-center" id="lista">
                            
                            {{ nome }}

                            <form action="{{ url_for('exclui') }}" method="post">
                                <input type="hidden" name="nome" value="{{ nome }}">
                                <input type="hidden" name="origem" value="lista">
                                <button class="btn btn-danger btn-sm">Excluir</button>
                            </form>

                        </li>
                    {% endfor %}
                </ul>
            {% else %}
                <center><p>Nenhum usuário cadastrado.</p></center>
            {% endif %}

            <hr>

            <center><a href="/"><button class="btn-primary">Voltar</button></a></center>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>


</body>
</html>
